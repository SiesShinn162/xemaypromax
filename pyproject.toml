[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motorcycle-recommender"
version = "1.0.0"
description = "Gợi ý xe máy bằng KNN có trọng số, giải thích Top-K bằng Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.64,<2",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "google-genai>=2.33,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
motorcycle-precision = "danh_gia.do_chinh_xac_k:chay_cli"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["goi_xe*", "danh_gia*"]

[tool.pytest.ini_options]
testpaths = ["kiem_thu"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".agents",
    ".opencode",
    "data",
    "__pycache__",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
